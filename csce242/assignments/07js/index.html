<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--
        Author: Tyson McCray
        -->
        <title>Assignment 7 - Introduction to JavaScript</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page">
            <header>
                <h1>Assignment 7</h1>
                <p class="subtitle">Introduction to JavaScript</p>
            </header>
            <!-- Three-column layout: Speech, Beverage, and Add a Sticker panels -->
            <main class="panels">
                <section class="panel panel-speech" id="panel-speech">
                    <h2>Speech</h2>
                    <!-- Click anywhere in this panel to toggle the CSS speech bubble -->
                    <div class="speech-area">
                        <div class="speech-bubble" id="speech-bubble">Hi</div>
                    </div>
                </section>
                <section class="panel panel-beverage" id="panel-beverage">
                    <h2>Beverage</h2>
                    <label for="beverage-select">Pick your morning beverage:</label>
                    <select id="beverage-select">
                        <option value="Coffee" selected>Coffee</option>
                        <option value="Orange Juice">Orange Juice</option>
                        <option value="Tea">Tea</option>
                        <option value="Water">Water</option>
                    </select>
                    <!-- Filled in by the change handler once a beverage is picked -->
                    <p id="beverage-message"></p>
                </section>
                <section class="panel panel-sticker" id="panel-sticker">
                    <h2>Add a Sticker</h2>
                    <!-- sticker-area is the relatively-positioned parent the emoji sticker is absolutely placed against -->
                    <div class="sticker-area" id="sticker-area">
                        <span class="sun-graphic" aria-hidden="true">&#127774;</span>
                        <span class="sticker" id="sticker" aria-hidden="true">&#10024;</span>
                    </div>
                </section>
            </main>
            <!-- Submit button added in a later commit -->
            <footer>
                <p>@McCray-T</p>
            </footer>
        </div>
        <script src="scripts/app.js"></script>
    </body>
</html>
